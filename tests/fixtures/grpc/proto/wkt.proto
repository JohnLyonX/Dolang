syntax = "proto3";

package dolang.test.wkt.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

service WktService {
  rpc RoundTrip(WktRequest) returns (WktResponse);
}

message WktRequest {
  google.protobuf.Any payload = 1;
  google.protobuf.Timestamp created_at = 2;
}

message WktResponse {
  google.protobuf.Any payload = 1;
  google.protobuf.Timestamp created_at = 2;
}
