[package]
name = "dolang-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
dolang-frontend = { path = "../dolang-frontend" }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
