<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dolang Newsroom Sign In</title>
  <link rel="stylesheet" href="/assets/css/news.css">
</head>
<body class="news-site login-page">
  <div class="site-frame">
    <header class="site-masthead compact-masthead">
      <div>
        <p class="section-kicker">Newsroom Access</p>
        <a class="masthead-mark" href="/">Dolang Newsroom</a>
      </div>
      <nav class="site-nav">
        <a href="/">Front Page</a>
        <a href="/news">Latest</a>
        <a href="/console">Console</a>
      </nav>
    </header>

    <main class="login-shell">
      <section class="login-panel">
        <p class="page-label">Newsroom Sign In</p>
        <h1>Sign in to the editorial desk.</h1>
        <p class="login-copy">Use your newsroom account to review drafts, edit stories, and, when permitted, publish to the public site.</p>

        <form id="login-form" class="login-form">
          <label>
            <span>Username</span>
            <input id="username" name="username" value="admin" autocomplete="username" required>
          </label>
          <label>
            <span>Password</span>
            <input id="password" name="password" type="password" value="password123" autocomplete="current-password" required>
          </label>
          <button type="submit">Sign In</button>
        </form>

        <div id="login-status" class="login-status">No active sign-in attempt.</div>
      </section>
    </main>
  </div>

  <script src="/assets/js/login.js"></script>
</body>
</html>
