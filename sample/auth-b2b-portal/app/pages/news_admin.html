<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dolang News Admin</title>
  <link rel="stylesheet" href="/assets/css/news_admin.css">
</head>
<body class="news-admin-page">
  <main class="news-admin-shell">
    <header class="news-admin-header">
      <div>
        <p class="eyebrow">News Admin</p>
        <h1>Draft, publish, and review newsroom content.</h1>
      </div>
      <nav class="news-admin-nav">
        <a href="/news">Public News</a>
        <a href="/console">Auth Console</a>
      </nav>
    </header>

    <section id="identity-panel" class="panel"></section>
    <section class="panel">
      <div class="transport-row">
        <label>
          <span>Transport</span>
          <select id="transport">
            <option value="cookie">Cookie Session</option>
            <option value="bearer">Bearer JWT</option>
          </select>
        </label>
        <label>
          <span>CSRF Token</span>
          <textarea id="csrf-token" rows="2" readonly></textarea>
        </label>
        <label>
          <span>Access Token</span>
          <textarea id="access-token" rows="3" placeholder="Paste bearer token from /console when needed"></textarea>
        </label>
      </div>
    </section>

    <section class="panel">
      <h2>Articles</h2>
      <div id="article-list" class="article-list"></div>
    </section>

    <section class="panel">
      <h2>Editor</h2>
      <form id="editor-form" class="editor-grid">
        <input id="article-id" type="hidden">
        <label><span>Slug</span><input id="slug" required></label>
        <label><span>Title</span><input id="title" required></label>
        <label><span>Summary</span><textarea id="summary" rows="3" required></textarea></label>
        <label><span>Body</span><textarea id="body" rows="8" required></textarea></label>
        <label>
          <span>Category</span>
          <select id="category-id" required>
            <option value="cat_company">Company</option>
            <option value="cat_product">Product</option>
            <option value="cat_security">Security</option>
          </select>
        </label>
        <div class="button-row">
          <button type="submit">Save Draft</button>
          <button id="publish-btn" type="button">Publish</button>
          <button id="unpublish-btn" type="button">Unpublish</button>
          <button id="reset-btn" type="button">Reset</button>
        </div>
      </form>
    </section>

    <section id="response-panel" class="panel response-panel"></section>
  </main>

  <script src="/assets/js/news_admin.js"></script>
</body>
</html>
