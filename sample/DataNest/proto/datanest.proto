syntax = "proto3";

package datanest.v1;
option go_package = "datanest/go-service/internal/pb;pb";

service DataNestService {
  rpc CreateNote(CreateNoteRequest) returns (NoteDetail);
  rpc GetNote(GetNoteRequest) returns (NoteDetail);
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse);
  rpc SearchNotes(SearchNotesRequest) returns (ListNotesResponse);
  rpc CreateTag(CreateTagRequest) returns (Tag);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc AttachTagToNote(AttachTagToNoteRequest) returns (NoteDetail);
}

message Tag {
  string tag_id = 1;
  string name = 2;
  string user_id = 3;
  int64 created_at = 4;
}

message NoteSummary {
  string note_id = 1;
  string title = 2;
  string content_preview = 3;
  string user_id = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message NoteDetail {
  string note_id = 1;
  string title = 2;
  string content = 3;
  string user_id = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  repeated Tag tags = 7;
}

message CreateNoteRequest {
  string title = 1;
  string content = 2;
}

message GetNoteRequest {
  string note_id = 1;
}

message ListNotesRequest {}

message SearchNotesRequest {
  string query = 1;
}

message ListNotesResponse {
  repeated NoteSummary notes = 1;
}

message CreateTagRequest {
  string name = 1;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message AttachTagToNoteRequest {
  string note_id = 1;
  string tag_id = 2;
}
