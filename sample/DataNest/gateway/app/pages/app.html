<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataNest</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #1a1a2e;
    }

    /* ── Navbar ── */
    .navbar {
      height: 52px;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      gap: 12px;
    }
    .navbar .logo { font-size: 1.1rem; font-weight: 700; color: #fff; flex: 1; }
    .navbar .logo span { color: #7b93ff; }
    .navbar .user-info { font-size: 0.8rem; color: #aaa; }
    .navbar .logout-btn {
      background: transparent;
      border: 1px solid #444;
      color: #ccc;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .navbar .logout-btn:hover { background: #2a2a40; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e8eaf0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 7px;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 10px;
    }
    .search-box:focus { border-color: #4f6ef7; }
    .new-note-btn {
      width: 100%;
      padding: 8px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .new-note-btn:hover { background: #3a58e0; }
    .notes-list { flex: 1; overflow-y: auto; }
    .note-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background 0.1s;
    }
    .note-item:hover { background: #f7f8ff; }
    .note-item.active { background: #eef1ff; border-left: 3px solid #4f6ef7; }
    .note-item-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item-preview { font-size: 0.78rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note-item-date { font-size: 0.72rem; color: #bbb; margin-top: 4px; }
    .empty-notes { padding: 32px 16px; text-align: center; color: #bbb; font-size: 0.85rem; }

    /* ── Main area ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Create note panel */
    .create-panel {
      background: #fff;
      border-bottom: 1px solid #e8eaf0;
      padding: 16px 24px;
      display: none;
    }
    .create-panel.visible { display: block; }
    .create-panel h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 12px; color: #444; }
    .create-panel input, .create-panel textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 0.875rem;
      outline: none;
      font-family: inherit;
      margin-bottom: 10px;
      resize: vertical;
    }
    .create-panel input:focus, .create-panel textarea:focus { border-color: #4f6ef7; }
    .create-panel textarea { min-height: 80px; }
    .create-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-save {
      padding: 7px 18px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: #3a58e0; }
    .btn-cancel {
      padding: 7px 16px;
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #666;
    }
    .btn-cancel:hover { background: #f5f5f5; }

    /* Note detail */
    .note-detail {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #ccc;
      font-size: 0.95rem;
    }
    .detail-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .detail-meta {
      font-size: 0.78rem;
      color: #aaa;
      margin-bottom: 16px;
    }
    .detail-content {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #333;
      white-space: pre-wrap;
      margin-bottom: 24px;
    }

    /* Tags section */
    .tags-section { border-top: 1px solid #f0f0f0; padding-top: 16px; }
    .tags-section h4 { font-size: 0.8rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
    .tags-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag-chip {
      background: #eef1ff;
      color: #4f6ef7;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .tag-attach { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tag-select {
      padding: 6px 10px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      background: #fff;
    }
    .tag-select:focus { border-color: #4f6ef7; }
    .btn-attach {
      padding: 6px 14px;
      background: #f0f2ff;
      color: #4f6ef7;
      border: 1px solid #c5cdff;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-attach:hover { background: #dde3ff; }
    .new-tag-form { display: flex; gap: 8px; margin-top: 8px; }
    .new-tag-input {
      flex: 1;
      padding: 6px 10px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
    }
    .new-tag-input:focus { border-color: #4f6ef7; }
    .btn-create-tag {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #666;
      white-space: nowrap;
    }
    .btn-create-tag:hover { background: #f5f5f5; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1a1a2e;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background: #c62828; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">Data<span>Nest</span></div>
    <span class="user-info" id="userInfo"></span>
    <button class="logout-btn" onclick="logout()">退出</button>
  </nav>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <input class="search-box" id="searchInput" type="text" placeholder="搜索笔记…" autocomplete="off">
        <button class="new-note-btn" onclick="toggleCreatePanel()">+ 新建笔记</button>
      </div>
      <div class="notes-list" id="notesList"></div>
    </aside>

    <!-- Main -->
    <div class="main">
      <!-- Create panel -->
      <div class="create-panel" id="createPanel">
        <h3>新建笔记</h3>
        <input id="newTitle" type="text" placeholder="笔记标题">
        <textarea id="newContent" placeholder="笔记内容…"></textarea>
        <div class="create-actions">
          <button class="btn-cancel" onclick="toggleCreatePanel()">取消</button>
          <button class="btn-save" onclick="createNote()">保存</button>
        </div>
      </div>

      <!-- Note detail -->
      <div class="note-detail" id="noteDetail">
        <div class="placeholder" id="placeholder">← 选择左侧笔记查看详情</div>
        <div id="detailContent" style="display:none">
          <div class="detail-title" id="detailTitle"></div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="detail-content" id="detailBody"></div>
          <div class="tags-section">
            <h4>标签</h4>
            <div class="tags-list" id="detailTags"></div>
            <div class="tag-attach">
              <select class="tag-select" id="tagSelect">
                <option value="">选择已有标签…</option>
              </select>
              <button class="btn-attach" onclick="attachTag()">绑定标签</button>
            </div>
            <div class="new-tag-form">
              <input class="new-tag-input" id="newTagName" type="text" placeholder="创建新标签…">
              <button class="btn-create-tag" onclick="createTag()">+ 创建</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ── Auth ──────────────────────────────────────────────────────
    const token = localStorage.getItem('datanest_token');
    if (!token) { location.href = '/login'; }

    const user = JSON.parse(localStorage.getItem('datanest_user') || '{}');
    document.getElementById('userInfo').textContent = user.username || '';

    function logout() {
      localStorage.removeItem('datanest_token');
      localStorage.removeItem('datanest_user');
      location.href = '/login';
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    async function api(method, path, body) {
      const opts = { method, headers: authHeaders() };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (res.status === 401) { logout(); return null; }
      return res.json();
    }

    // ── Toast ─────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
    }

    // ── State ─────────────────────────────────────────────────────
    let notes = [];
    let allTags = [];
    let activeNoteId = null;

    // ── Notes List ────────────────────────────────────────────────
    async function loadNotes(q = '') {
      const path = q ? '/api/notes/search?q=' + encodeURIComponent(q) : '/api/notes';
      const data = await api('GET', path);
      if (!data) return;
      notes = Array.isArray(data) ? data : [];
      renderNotesList();
    }

    function renderNotesList() {
      const el = document.getElementById('notesList');
      if (!notes.length) {
        el.innerHTML = '<div class="empty-notes">暂无笔记<br>点击"新建笔记"开始</div>';
        return;
      }
      el.innerHTML = notes.map(n => `
        <div class="note-item ${n.note_id === activeNoteId ? 'active' : ''}"
             onclick="openNote('${n.note_id}')">
          <div class="note-item-title">${esc(n.title)}</div>
          <div class="note-item-preview">${esc(n.content_preview || '')}</div>
          <div class="note-item-date">${fmtDate(n.updated_at)}</div>
        </div>
      `).join('');
    }

    // ── Note Detail ───────────────────────────────────────────────
    async function openNote(id) {
      activeNoteId = id;
      renderNotesList();
      const data = await api('GET', '/api/notes/' + id);
      if (!data || data.status) {
        showToast('加载失败：' + (data?.message || '未知错误'), true);
        return;
      }
      document.getElementById('placeholder').style.display = 'none';
      const detail = document.getElementById('detailContent');
      detail.style.display = 'block';
      document.getElementById('detailTitle').textContent = data.title;
      document.getElementById('detailMeta').textContent =
        '更新于 ' + fmtDate(data.updated_at) + '  ·  创建于 ' + fmtDate(data.created_at);
      document.getElementById('detailBody').textContent = data.content;
      renderDetailTags(data.tags || []);
      populateTagSelect(data.tags || []);
    }

    function renderDetailTags(tags) {
      const el = document.getElementById('detailTags');
      el.innerHTML = tags.length
        ? tags.map(t => `<span class="tag-chip">${esc(t.name)}</span>`).join('')
        : '<span style="color:#ccc;font-size:0.8rem">暂无标签</span>';
    }

    function populateTagSelect(noteTags) {
      const attached = new Set(noteTags.map(t => t.tag_id));
      const select = document.getElementById('tagSelect');
      select.innerHTML = '<option value="">选择已有标签…</option>' +
        allTags
          .filter(t => !attached.has(t.tag_id))
          .map(t => `<option value="${t.tag_id}">${esc(t.name)}</option>`)
          .join('');
    }

    // ── Create Note ───────────────────────────────────────────────
    function toggleCreatePanel() {
      const panel = document.getElementById('createPanel');
      const visible = panel.classList.toggle('visible');
      if (visible) {
        document.getElementById('newTitle').focus();
      } else {
        document.getElementById('newTitle').value = '';
        document.getElementById('newContent').value = '';
      }
    }

    async function createNote() {
      const title = document.getElementById('newTitle').value.trim();
      const content = document.getElementById('newContent').value.trim();
      if (!title) { showToast('请输入标题', true); return; }
      if (!content) { showToast('请输入内容', true); return; }
      const data = await api('POST', '/api/notes', { title, content });
      if (data?.note_id) {
        showToast('笔记已创建');
        toggleCreatePanel();
        await loadNotes();
        openNote(data.note_id);
      } else {
        showToast(data?.message || '创建失败', true);
      }
    }

    // ── Tags ──────────────────────────────────────────────────────
    async function loadTags() {
      const data = await api('GET', '/api/tags');
      allTags = Array.isArray(data) ? data : [];
    }

    async function createTag() {
      const name = document.getElementById('newTagName').value.trim();
      if (!name) return;
      const data = await api('POST', '/api/tags', { name });
      if (data?.tag_id) {
        allTags.push(data);
        document.getElementById('newTagName').value = '';
        showToast('标签已创建：' + data.name);
        if (activeNoteId) openNote(activeNoteId);
      } else {
        showToast(data?.message || '创建标签失败', true);
      }
    }

    async function attachTag() {
      const tagId = document.getElementById('tagSelect').value;
      if (!tagId || !activeNoteId) return;
      const data = await api('POST', '/api/notes/' + activeNoteId + '/tags', { tag_id: tagId });
      if (data?.note_id) {
        showToast('标签已绑定');
        openNote(activeNoteId);
      } else {
        showToast(data?.message || '绑定失败', true);
      }
    }

    // ── Search ────────────────────────────────────────────────────
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => loadNotes(e.target.value.trim()), 300);
    });

    // ── Utils ─────────────────────────────────────────────────────
    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtDate(ts) {
      if (!ts) return '';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // ── Init ──────────────────────────────────────────────────────
    (async () => {
      await Promise.all([loadNotes(), loadTags()]);
    })();
  </script>
</body>
</html>
