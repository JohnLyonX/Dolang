[workspace]
members = [
    ".",
    "crates/dolang-frontend",
    "crates/dolang-runtime",
    "crates/dolang-cli",
    "crates/dolang-lsp",
]

[package]
name = "dolang"
version = "2026.0.0"
edition = "2024"

[dependencies]
dolang_frontend = { package = "dolang-frontend", path = "crates/dolang-frontend" }
dolang_runtime = { package = "dolang-runtime", path = "crates/dolang-runtime" }
dolang_cli = { package = "dolang-cli", path = "crates/dolang-cli" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "phase12_baseline"
harness = false
