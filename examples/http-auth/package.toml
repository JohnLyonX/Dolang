[project]
name = "http-auth"
version = "0.1.0"
entry = "main.dol"

[server]
host = "127.0.0.1"
port = 8080

[server.auth]
enabled = true
default_scheme = "session"
identity_sources = ["cookie", "bearer"]

[server.auth.session]
enabled = true
cookie_name = "dolang_session"
cookie_http_only = true
cookie_same_site = "lax"
cookie_secure = false
ttl_seconds = 86400
idle_timeout_seconds = 7200
rotation = "on_login"

[server.auth.session.store]
driver = "memory"

[server.auth.jwt]
enabled = true
issuer = "dolang-example"
audience = "http-auth"
algorithm = "HS256"
secret = "replace-me-before-production"
access_ttl_seconds = 3600
refresh_ttl_seconds = 2592000

[server.auth.authorization]
enabled = true
default = "public"

[[server.auth.authorization.rules]]
method = "GET"
path = "/me"
require = "authenticated"

[[server.auth.authorization.rules]]
method = "POST"
path = "/logout"
require = "authenticated"

[[server.auth.authorization.rules]]
method = "GET"
path = "/admin"
require = "authenticated"
roles_any = ["admin"]
