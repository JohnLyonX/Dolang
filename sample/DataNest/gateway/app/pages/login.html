<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataNest — 登录</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .logo { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .logo span { color: #4f6ef7; }
    .subtitle { color: #666; font-size: 0.875rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #444; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #4f6ef7; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }
    .btn:hover { background: #3a58e0; }
    .btn:disabled { background: #a0adf8; cursor: not-allowed; }
    .error {
      background: #fff0f0;
      color: #c62828;
      border: 1px solid #ffcdd2;
      border-radius: 7px;
      padding: 9px 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .footer { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #666; }
    .footer a { color: #4f6ef7; text-decoration: none; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Data<span>Nest</span></div>
    <p class="subtitle">登录你的笔记账号</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="username">用户名</label>
      <input id="username" type="text" placeholder="输入用户名" required autocomplete="username">
      <label for="password">密码</label>
      <input id="password" type="password" placeholder="输入密码" required autocomplete="current-password">
      <button class="btn" type="submit" id="submitBtn">登录</button>
    </form>
    <p class="footer">还没有账号？<a href="/register">立即注册</a></p>
  </div>
  <script>
    // 已登录则跳转
    if (localStorage.getItem('datanest_token')) {
      location.href = '/';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.ok) {
          localStorage.setItem('datanest_token', data.access_token);
          localStorage.setItem('datanest_user', JSON.stringify(data.user));
          location.href = '/';
        } else {
          errEl.textContent = data.message || '用户名或密码错误';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = '网络错误，请重试';
        errEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
