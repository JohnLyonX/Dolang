[workspace]
members = [
    ".", # 解释器
    "crates/dolang-lsp", # lsp
]

[package]
name = "dolang"
version = "1.7.0"
edition = "2024"

[dependencies]
atty = "0.2"
axum = "0.7"
crossterm = "0.29"
http = "1"
indexmap = "2"
libc = "0.2"
once_cell = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
