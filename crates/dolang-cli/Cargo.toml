[package]
name = "dolang-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
atty = "0.2"
axum = "0.7"
crossterm = "0.29"
indexmap = "2"
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
dolang = { package = "dolang-runtime", path = "../dolang-runtime" }

[[bin]]
name = "dolang-cli"
path = "src/main.rs"
